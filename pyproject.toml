[project]
name = "orca-marine-platform"
version = "2.0.0"
description = "Project ORCA Agentic Marine Intelligence Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["backend", "ops", "scripts"]
extraPaths = [
    "backend",
    "backend/src",
    "C:/Users/jadeu/AppData/Local/Python/pythoncore-3.14-64/Lib/site-packages"
]
reportMissingImports = false
reportMissingModuleSource = false
pythonVersion = "3.14"
pythonPlatform = "Windows"
executionEnvironments = [
  { root = "backend", extraPaths = ["backend", "backend/src", "C:/Users/jadeu/AppData/Local/Python/pythoncore-3.14-64/Lib/site-packages"] }
]

[tool.pylint]
init-hook = 'import sys; sys.path.extend(["backend", "backend/src", "C:/Users/jadeu/AppData/Local/Python/pythoncore-3.14-64/Lib/site-packages"])'
