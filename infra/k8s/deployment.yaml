apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca-backend-deployment
  labels:
    app: orca-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orca-backend
  template:
    metadata:
      labels:
        app: orca-backend
    spec:
      containers:
        - name: backend
          image: orca/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: orca-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
